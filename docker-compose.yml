services:
  postgres:
    image: postgres:16-alpine
    container_name: postos-postgres
    environment:
      POSTGRES_DB: postos
      POSTGRES_USER: postos
      POSTGRES_PASSWORD: postos
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postos -d postos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
